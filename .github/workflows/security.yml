name: Security

# CodeQL code scanning (Kotlin and the workflows themselves) weekly and on master, the Gradle
# dependency graph for Dependabot alerts, and a dependency review on every pull request that
# blocks newly added dependencies with known high-severity vulnerabilities.
on:
  push:
    branches: [master, web-beta]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  dependency-graph:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/dependency-submission@v4

  codeql:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # The Kotlin the app and the shared code are made of, compiled for Android.
      - name: Compile
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --no-daemon --no-build-cache :clean-ui:compileDebugKotlinAndroid :app:compileProductionDebugKotlin
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
