name: Release APK

# Every push to master publishes a signed APK to GitHub Releases, which
# Obtainium (or a browser) on the phone installs and updates from.
# Pull requests build the same release APK as a check, without publishing.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bump the prefix by hand for a bigger version jump; the build number is added by CI.
  VERSION_PREFIX: "1.2"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          # Must stay above 11, the last hand-set versionCode, so installs upgrade.
          echo "APP_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing. See docs/RELEASES.md."
              exit 1
            fi
            # Pull requests without the real key sign with a throwaway one, as a build check.
            echo "No signing key available; signing with a throwaway key as a check."
            SIGNING_STORE_PASSWORD=throwaway
            SIGNING_KEY_PASSWORD=throwaway
            SIGNING_KEY_ALIAS=check
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 -alias check \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=check" \
              -storepass throwaway -keypass throwaway
          else
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            # Only the keystore and its password are required; docs/RELEASES.md uses these defaults.
            SIGNING_KEY_ALIAS="${SIGNING_KEY_ALIAS:-phoenix}"
            SIGNING_KEY_PASSWORD="${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"
          fi
          {
            echo "SIGNING_KEYSTORE_PATH=$KEYSTORE"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew --no-daemon :app:assembleProductionRelease
          mkdir -p dist
          cp app/build/outputs/apk/production/release/*.apk "dist/vitruvian-${APP_VERSION_NAME}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: vitruvian-release-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION_NAME}" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "vitruvian- ${APP_VERSION_NAME}" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"

  # The Garmin watch app (watch/). The compiler and the Venu 4 device files are in
  # watch/toolchain (copied from the Connect IQ SDK Manager), so no Garmin login is needed.
  # The .prg is attached to the same release as the APK. See docs/GARMIN_WATCH.md.
  watch:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CIQ_DEVELOPER_KEY_BASE64: ${{ secrets.CIQ_DEVELOPER_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build watch app
        run: |
          KEY="$RUNNER_TEMP/developer_key.der"
          if [ -n "$CIQ_DEVELOPER_KEY_BASE64" ]; then
            echo "$CIQ_DEVELOPER_KEY_BASE64" | base64 -d > "$KEY"
          else
            # A sideloaded app installs with any key; set CIQ_DEVELOPER_KEY_BASE64 to keep one.
            openssl genrsa -out "$RUNNER_TEMP/key.pem" 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/key.pem" -out "$KEY" -nocrypt
          fi
          # The compiler looks for device files in ~/.Garmin/ConnectIQ/Devices.
          mkdir -p "$HOME/.Garmin/ConnectIQ"
          ln -s "$GITHUB_WORKSPACE/watch/toolchain/Devices" "$HOME/.Garmin/ConnectIQ/Devices"
          mkdir -p dist
          for DEVICE in $(grep -oP '<iq:product id="\K[^"]+' watch/manifest.xml); do
            java -Xms1g -Dfile.encoding=UTF-8 -classpath watch/toolchain/sdk-bin/monkeybrains.jar \
              com.garmin.monkeybrains.Monkeybrains -f watch/monkey.jungle -d "$DEVICE" -y "$KEY" -l 2 -r \
              -o "dist/vitruvian-$DEVICE.prg"
          done
          rm -f dist/*.debug.xml
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: vitruvian-watch-app
          path: dist/*.prg

      - name: Attach to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}" dist/*.prg --clobber
