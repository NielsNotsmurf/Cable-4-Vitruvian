name: Release APK

# Every push to master publishes a signed APK to GitHub Releases, which
# Obtainium (or a browser) on the phone installs and updates from.
# Pull requests are built by android-build.yml only, so the app isn't built twice
# (Actions minutes are limited on a private repo).

on:
  push:
    branches: [master]
    # Only changes to what the app is built from need a new APK.
    paths:
      - 'app/**'
      - 'clean-ui/**'
      - 'web-app/**'
      - 'gradle/**'
      - 'kotlin-js-store/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'package.json'
      - '.github/workflows/release.yml'
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bump the prefix by hand for a bigger version jump; the build number is added by CI.
  VERSION_PREFIX: "2.0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          # Must stay above 155, the last versionCode built in the old private repo
          # (run 55, 100 + run), so installed copies keep upgrading.
          echo "APP_VERSION_CODE=$((200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          # A [pre-release] merge (see Publish GitHub release) gets a -beta version name.
          SUFFIX=""
          if git log -1 --pretty=%B | grep -qi '\[pre-release\]'; then SUFFIX="-beta"; fi
          echo "APP_VERSION_NAME=${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}${SUFFIX}" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing. See docs/RELEASES.md."
              exit 1
            fi
            # Pull requests without the real key sign with a throwaway one, as a build check.
            echo "No signing key available; signing with a throwaway key as a check."
            SIGNING_STORE_PASSWORD=throwaway
            SIGNING_KEY_PASSWORD=throwaway
            SIGNING_KEY_ALIAS=check
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 -alias check \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=check" \
              -storepass throwaway -keypass throwaway
          else
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            # Only the keystore and its password are required; docs/RELEASES.md uses these defaults.
            SIGNING_KEY_ALIAS="${SIGNING_KEY_ALIAS:-phoenix}"
            SIGNING_KEY_PASSWORD="${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"
          fi
          {
            echo "SIGNING_KEYSTORE_PATH=$KEYSTORE"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew --no-daemon :app:assembleProductionRelease
          mkdir -p dist
          cp app/build/outputs/apk/production/release/*.apk "dist/vitruvian-${APP_VERSION_NAME}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: vitruvian-release-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A merge whose message contains [pre-release] (the web beta) is published as a
          # pre-release. Obtainium skips those unless "Include prereleases" is on.
          NOTES="Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)

          Goal: once sponsors cover about €200 (Apple developer account for two years, Google Play once), Cable moves to TestFlight and the Play Store. https://github.com/sponsors/NielsNotsmurf"
          EXTRA=()
          if git log -1 --pretty=%B | grep -qi '\[pre-release\]'; then
            EXTRA=(--prerelease)
            NOTES="Beta / pre-release. Includes the Cable web app (beta): https://nielsnotsmurf.github.io/Cable-4-Vitruvian/app/ (iPhone and iPad: train through the Bluefy browser, see the README).

          ${NOTES}"
          fi
          gh release create "v${APP_VERSION_NAME}" dist/*.apk "${EXTRA[@]}" \
            --target "$GITHUB_SHA" \
            --title "Cable ${APP_VERSION_NAME}" \
            --notes "$NOTES"
