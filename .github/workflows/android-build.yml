name: Android build

# Pull requests only: master is built by release.yml, which saves Actions minutes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A new push to the same PR stops the run for the old one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Build only when a PR touches something the app is built from (modules, Gradle files,
      # the build and release workflows). Otherwise the check reports green right away, so a
      # required "build" check never blocks a README or docs PR.
      - name: Build files changed?
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -v '\.md$' \
              | grep -qE '^(app/|clean-ui/|web-app/|gradle/|kotlin-js-store/|[^/]*\.gradle\.kts$|gradle\.properties$|gradlew|package\.json$|\.github/workflows/(android-build|release)\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "No build files changed, skipping the build."
          fi

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        if: steps.changes.outputs.code == 'true'

      # Shared code is tested on both platforms: Android (JVM) and web (wasm, in headless Chrome).
      - name: Clean UI unit tests (Android + web)
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew --no-daemon :clean-ui:testDebugUnitTest :clean-ui:wasmJsTest

      # The web app is the same screens; it must build whenever the app does.
      - name: Build web app
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew --no-daemon :web-app:wasmJsBrowserDistribution

      - name: Build debug APK
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew --no-daemon :app:assembleProductionDebug

      - name: APK still contains the Clean UI assets
        if: steps.changes.outputs.code == 'true'
        run: unzip -l app/build/outputs/apk/production/debug/*.apk | grep -q one_rep_max_map.json

      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code == 'true'
        with:
          retention-days: 3
          name: phoenix-debug-apk
          path: app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code == 'true'
        with:
          retention-days: 3
          name: web-app
          path: web-app/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
