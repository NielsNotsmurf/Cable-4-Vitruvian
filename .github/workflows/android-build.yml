name: Android build

# Pull requests only: master is built by release.yml, which saves Actions minutes.
on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR stops the run for the old one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clean UI unit tests
        run: ./gradlew --no-daemon :clean-ui:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleProductionDebug

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: phoenix-debug-apk
          path: app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: warn
